<meta name="mobile-web-app-capable" content="yes">

<style>
.leaflet-container{background:#191b28;font-family:'Inter',system-ui,sans-serif}
.leaflet-popup-content-wrapper{background:#20222f;color:#eeeef2;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.leaflet-popup-content{font-size:13px;line-height:1.5;margin:10px 12px}
.leaflet-popup-content a{color:#c0b6fb}
.leaflet-popup-tip{background:#20222f}
.leaflet-control-zoom a{background:#20222f!important;color:#eeeef2!important;border-color:#383b48!important}
.leaflet-control-zoom a:hover{background:#282a38!important}
.leaflet-control-attribution{background:rgba(11,12,20,.75)!important;color:#6d7186!important;font-size:9px!important;padding:2px 6px!important}
.leaflet-control-attribution a{color:#9397ab!important}

<style>
:root{
  --bg:#0b0c14;
  --surface:#14151f;
  --surface-2:#191b28;
  --card:#20222f;
  --card-2:#282a38;
  --border:#383b48;
  --border-soft:#2b2d3a;
  --text:#eeeef2;
  --text-2:#c7cadb;
  --text-3:#9397ab;
  --text-4:#6d7186;
  --accent:#9a8ce0;
  --accent-2:#c0b6fb;
  --accent-fill:#453d78;
  --accent-tint:rgba(154,140,224,.14);
  --good:#7fcf9f;
  --good-tint:rgba(127,207,159,.14);
  --warn:#e0b568;
  --warn-tint:rgba(224,181,104,.14);
  --danger:#e28a78;
  --danger-tint:rgba(226,138,120,.14);
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --tabbar-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--text);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{font-family:inherit;color:inherit}
a{color:var(--accent-2)}
::selection{background:var(--accent-fill);color:#fff}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

.shell{
  max-width:520px;margin:0 auto;min-height:100vh;position:relative;
  background:var(--bg);
  display:flex;flex-direction:column;
}
.appbar{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(var(--bg) 60%, transparent);
}
.appbar.solid{background:var(--bg);border-bottom:1px solid var(--border-soft)}
.appbar h1{font-size:20px}
.iconbtn{
  width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--text-2);flex:none;
}
.iconbtn:active{background:var(--card-2)}
.iconbtn.ghost{background:transparent}
.screen{
  flex:1;padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 24px);
  animation:rise .22s cubic-bezier(.2,.7,.3,1);
}
.screen.no-tab{padding-bottom:calc(var(--safe-b) + 24px)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:520px;margin:0 auto;
  display:flex;padding:8px calc(4px + var(--safe-l)) calc(6px + var(--safe-b)) calc(4px + var(--safe-r));
  background:rgba(20,21,31,.92);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border-top:1px solid var(--border-soft);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 2px;
  color:var(--text-4);
}
.tabbar .tab.active{color:var(--accent-2)}
.tabbar .tab span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tabbar .tab .dot{width:4px;height:4px;border-radius:50%;background:var(--accent-2);position:absolute;margin-top:-1px}

.px{padding-left:18px;padding-right:18px}
.section-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.muted{color:var(--text-3)}
.sub{color:var(--text-3);font-size:13px;line-height:1.5}

.row{display:flex;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap14{gap:14px}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;
  font-size:12.5px;font-weight:500;background:var(--card);box-shadow:inset 0 0 0 1px var(--border);color:var(--text-2);
  white-space:nowrap;flex:none;
}
.chip.on{background:var(--accent-fill);box-shadow:inset 0 0 0 1px var(--accent);color:#fff}
.chip svg{width:14px;height:14px}

.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.01em}
.tag-easy{background:var(--good-tint);color:var(--good)}
.tag-moderate{background:var(--accent-tint);color:var(--accent-2)}
.tag-hard{background:var(--warn-tint);color:var(--warn)}
.tag-strenuous{background:var(--danger-tint);color:var(--danger)}

.card{background:var(--card);border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-soft)}
.card-pad{padding:14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;border-radius:12px;font-size:14.5px;font-weight:600;
}
.btn-block{width:100%}
.btn-primary{background:var(--accent-2);color:#191330}
.btn-primary:active{background:#a99df0}
.btn-secondary{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.btn-ghost{color:var(--accent-2)}
.btn-danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}

.toggle{width:44px;height:26px;border-radius:14px;flex:none;position:relative;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--border)}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-3);transition:transform .16s ease,background .16s}
.toggle.on{background:var(--accent-fill);box-shadow:inset 0 0 0 1px var(--accent)}
.toggle.on .knob{transform:translateX(18px);background:var(--accent-2)}

.avatarph{
  border-radius:9px;background:
    repeating-linear-gradient(135deg,var(--card-2) 0 7px,var(--card) 7px 14px);
  display:flex;align-items:center;justify-content:center;position:relative;flex:none;color:var(--text-4);
}
.avatarph span{font:10px var(--font-mono);letter-spacing:.02em}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--card-2)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);
  box-shadow:0 2px 6px rgba(0,0,0,.5);margin-top:-8px;
}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--card-2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:none}

.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(6,6,10,.62);animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{
  position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;
  background:var(--surface-2);border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.6);
  padding:10px 18px calc(22px + var(--safe-b));animation:sheetup .2s cubic-bezier(.2,.7,.3,1);
}
@keyframes sheetup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--border);margin:2px auto 14px}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 14px);transform:translateX(-50%);
  background:var(--card-2);color:var(--text);box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.5);
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:80;
  display:flex;align-items:center;gap:8px;max-width:88%;animation:toastin .18s ease;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.stat-tile{flex:1;text-align:center;padding:13px 4px}
.stat-tile .v{font:700 17px var(--font-mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat-tile .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);margin-top:3px}
.divider-v{width:1px;background:var(--border-soft)}
.divider-h{height:1px;background:var(--border-soft)}

.trailcard{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:14px;box-shadow:inset 0 0 0 1px var(--border-soft)}
.trailcard .thumb{width:78px;height:78px;border-radius:10px}
.trailcard .name{font-size:14.5px;font-weight:600;line-height:1.3}
.trailcard .meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
.trailcard .stats{display:flex;gap:9px;margin-top:6px;font:12px var(--font-mono);color:var(--text-2)}

.field-label{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:7px;display:block}
.textinput{
  width:100%;background:var(--card);box-shadow:inset 0 0 0 1px var(--border);border-radius:11px;
  padding:12px 13px;font-size:14px;color:var(--text);
}
.textinput::placeholder{color:var(--text-4)}
textarea.textinput{resize:vertical;min-height:76px;font-family:var(--font-ui)}

.progress-track{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--accent-2)}

.map-abstract{position:relative;overflow:hidden;background:
  radial-gradient(circle at 32% 30%,rgba(154,140,224,.16),transparent 58%),
  repeating-radial-gradient(circle at 30% 40%,transparent 0 12px,rgba(238,238,242,.045) 12px 13px),
  repeating-radial-gradient(circle at 76% 74%,transparent 0 16px,rgba(238,238,242,.035) 16px 17px),
  #171928;}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.livedot{width:14px;height:14px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 7px rgba(192,182,251,.18);animation:pulse 2.4s infinite}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:50px 30px;color:var(--text-3)}
.empty svg{width:34px;height:34px;color:var(--text-4)}
.linkout{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--accent-2);font-weight:500}

@media (min-width:521px){
  body{background:var(--bg)}
  .shell{box-shadow:0 0 0 1px var(--border-soft)}
}
</style>
</head>

/* ---------------------------------------------------------------- real map tiles (OpenStreetMap, via Leaflet) */
function lon2tileX(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2tileY(lat,z){ const r=lat*Math.PI/180; return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
function regionTileUrls(region, full){
  const box = full? 0.22 : 0.12;
  const zooms = full? [10,11,12,13,14] : [10,11,12,13];
  const urls=[];
  zooms.forEach(z=>{
    const x0=lon2tileX(region.lon-box,z), x1=lon2tileX(region.lon+box,z);
    const y0=lat2tileY(region.lat+box,z), y1=lat2tileY(region.lat-box,z);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) urls.push('https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png');
  });
  return urls;
}

/* ---------------------------------------------------------------- state */
const LS_PREFIX='ridgeline:';
function ld(k,d){try{const v=localStorage.getItem(LS_PREFIX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(LS_PREFIX+k,JSON.stringify(v));}catch(e){}}

function defaultFilters(){return {q:'',region:'all',activities:[],difficulty:[],routeType:[],lenIdx:5,gainIdx:5,offlineOnly:false,dogsOk:false,kidsOk:false,readChips:[]};}
const LEN_STEPS=[3,6,10,16,25,Infinity];
const GAIN_STEPS=[150,300,600,900,1500,Infinity];

const S = {
  onboarded: ld('onboarded', false),
  units: ld('units','km'),
  saved: ld('saved', []),
  downloaded: ld('downloaded', []),
  storagePlan: ld('storagePlan', {detail:'standard', satellite:true, trails:true}),
  autoUpdate: ld('autoUpdate', true),
  wifiOnly: ld('wifiOnly', true),
  activities: ld('activities', []),
  displayName: ld('displayName', ''),
  filters: defaultFilters(),
  view: 'explore', params:{}, tab:'explore',
  geo:{status:'idle', lat:null, lon:null, err:null},
  record:{running:false,paused:false,startedAt:0,elapsedMs:0,distanceKm:0,gainM:0,path:[],lastAlt:null,trailId:null,timerId:null,watchId:null},
  toast:null,
};

function persistCore(){sv('onboarded',S.onboarded);sv('units',S.units);sv('saved',S.saved);sv('downloaded',S.downloaded);
  sv('storagePlan',S.storagePlan);sv('autoUpdate',S.autoUpdate);sv('wifiOnly',S.wifiOnly);sv('activities',S.activities);sv('displayName',S.displayName);}

function nav(view, params){ S.view=view; S.params=params||{}; S.tab = ['explore','search','record','offline','profile'].includes(view)?view:S.tab; render(); const sc=document.querySelector('.screen'); if(sc) sc.scrollTop=0; }
function showToast(msg, ic){ S.toast={msg,ic:ic||'checkCircle'}; render(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{S.toast=null;renderToastOnly();},2200); }
function renderToastOnly(){ const el=document.getElementById('toastHost'); if(el) el.outerHTML = toastHtml(); }

/* ---------------------------------------------------------------- units & format */
function kmToUnit(km){ return S.units==='km'? km : km*0.621371; }
function mToUnit(m){ return S.units==='km'? m : m*3.28084; }
function fmtDist(km){ return S.units==='km' ? (km<10?km.toFixed(1):Math.round(km))+' km' : (kmToUnit(km)<10?kmToUnit(km).toFixed(1):Math.round(kmToUnit(km)))+' mi'; }
function fmtElev(m){ return S.units==='km' ? Math.round(m)+' m' : Math.round(mToUnit(m))+' ft'; }
function fmtDuration(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h>0 ? (h+'h'+(m?' '+m+'m':'')) : (m+'m'); }
function fmtClock(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  return (h>0? String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function lenStepLabel(i){ return i>=LEN_STEPS.length-1 ? 'Any distance' : 'Under '+fmtDist(LEN_STEPS[i]); }
function gainStepLabel(i){ return i>=GAIN_STEPS.length-1 ? 'Any gain' : 'Under '+fmtElev(GAIN_STEPS[i]); }
function diffTagClass(d){ return d==='Easy'?'tag-easy':d==='Moderate'?'tag-moderate':d==='Hard'?'tag-hard':'tag-strenuous'; }

function regionStorageMB(regionId){
  const urls = regionTileUrls(regionOf(regionId), S.storagePlan.detail==='full');
  return Math.max(1, Math.round(urls.length*20/1024)); // ~20KB per real OSM tile
}
function totalStorageMB(){ return S.downloaded.reduce((sum,id)=>sum+regionStorageMB(id),0); }

/* ---------------------------------------------------------------- filters */
function matchesFilters(t, f){
  if(f.region!=='all' && t.region!==f.region) return false;
  if(f.offlineOnly && !S.downloaded.includes(t.region)) return false;
  if(f.difficulty.length && !f.difficulty.includes(t.difficulty)) return false;
  if(f.routeType.length && !f.routeType.includes(t.routeType)) return false;
  if(f.activities.length && !f.activities.some(a=>t.activities.includes(a))) return false;
  if(f.dogsOk && !(t.features.includes('dogs-leash')||t.features.includes('dogs'))) return false;
  if(f.kidsOk && !t.features.includes('kids')) return false;
  if(LEN_STEPS[f.lenIdx]!==Infinity && t.lengthKm > LEN_STEPS[f.lenIdx]) return false;
  if(GAIN_STEPS[f.gainIdx]!==Infinity && t.gainM > GAIN_STEPS[f.gainIdx]) return false;
  if(f.q){
    const q=f.q.toLowerCase();
    const hay=(t.name+' '+t.park+' '+t.near+' '+t.blurb+' '+t.activities.join(' ')+' '+t.features.join(' ')).toLowerCase();
    if(!hay.includes(q)){
      const words=q.split(/\s+/).filter(w=>w.length>2 && !['the','and','for','big','under','near','trails','trail','with'].includes(w));
      if(words.length && !words.some(w=>hay.includes(w))) return false;
    }
  }
  return true;
}
function filteredTrails(f){ return TRAILS.filter(t=>matchesFilters(t,f)); }
function activeFilterCount(f){
  let n=0; if(f.region!=='all')n++; n+=f.difficulty.length; n+=f.routeType.length; n+=f.activities.length;
  if(f.dogsOk)n++; if(f.kidsOk)n++; if(f.offlineOnly)n++; if(LEN_STEPS[f.lenIdx]!==Infinity)n++; if(GAIN_STEPS[f.gainIdx]!==Infinity)n++;
  return n;
}
function parseQuery(q){
  const f = Object.assign({}, S.filters); f.q=q; const chips=[];
  const s=q.toLowerCase();
  if(/waterfall/.test(s)) chips.push({icon:'route',label:'Waterfall'});
  if(/\bview|views|scenic\b/.test(s)) chips.push({icon:'mapPin',label:'Big views'});
  if(/dog/.test(s)){ f.dogsOk=true; chips.push({icon:'checkCircle',label:'Dog friendly'}); }
  if(/kid|family/.test(s)){ f.kidsOk=true; chips.push({icon:'checkCircle',label:'Kid friendly'}); }
  if(/loop/.test(s)){ f.routeType=['Loop']; chips.push({icon:'route',label:'Loop'}); }
  if(/easy/.test(s)){ f.difficulty=['Easy']; chips.push({icon:'gauge',label:'Easy'}); }
  else if(/strenuous|very hard/.test(s)){ f.difficulty=['Strenuous']; chips.push({icon:'gauge',label:'Strenuous'}); }
  else if(/hard|challenging/.test(s)){ f.difficulty=['Hard']; chips.push({icon:'gauge',label:'Hard'}); }
  else if(/moderate/.test(s)){ f.difficulty=['Moderate']; chips.push({icon:'gauge',label:'Moderate'}); }
  const under = s.match(/under\s+(\d+)\s?(km|mi|mile)/);
  if(under){ let km=parseFloat(under[1]); if(/mi/.test(under[2])) km*=1.60934;
    let idx=LEN_STEPS.findIndex(v=>v>=km); if(idx<0) idx=LEN_STEPS.length-1; f.lenIdx=idx;
    chips.push({icon:'route',label:'Under '+under[1]+' '+(under[2][0]==='k'?'km':'mi')}); }
  REGIONS.forEach(r=>{ const key=r.name.split('&')[0].trim().toLowerCase();
    if(s.includes(key.split(' ')[0]) || s.includes(r.id)){ f.region=r.id; chips.push({icon:'mapPin',label:r.name}); } });
  f.readChips = chips;
  return f;
}

/* ---------------------------------------------------------------- geolocation */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function requestLocationOnce(){
  if(!navigator.geolocation){ S.geo.status='unsupported'; render(); return; }
  S.geo.status='locating'; render();
  navigator.geolocation.getCurrentPosition(
    pos=>{ S.geo.status='ok'; S.geo.lat=pos.coords.latitude; S.geo.lon=pos.coords.longitude; render(); },
    err=>{ S.geo.status='denied'; S.geo.err=err.message; render(); },
    {enableHighAccuracy:false, timeout:8000, maximumAge:60000}
  );
}
function nearestRegion(){
  if(S.geo.status!=='ok') return null;
  let best=null,bd=Infinity;
  REGIONS.forEach(r=>{ const d=haversineKm(S.geo.lat,S.geo.lon,r.lat,r.lon); if(d<bd){bd=d;best=r;} });
  return {region:best, km:bd};
}

/* ---------------------------------------------------------------- recording */
function startRecording(trailId){
  const rec=S.record;
  rec.running=true; rec.paused=false; rec.startedAt=Date.now(); rec.elapsedMs=0;
  rec.distanceKm=0; rec.gainM=0; rec.path=[]; rec.lastAlt=null; rec.trailId=trailId||null;
  clearInterval(rec.timerId);
  rec.timerId=setInterval(()=>{ if(!rec.paused){ rec.elapsedMs=Date.now()-rec.startedAt-((rec._pausedMs)||0); tickRecordUI(); } },1000);
  if(navigator.geolocation){
    try{
      rec.watchId=navigator.geolocation.watchPosition(onGeoTick, onGeoErr, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
      rec.gpsState='locating';
    }catch(e){ rec.gpsState='unavailable'; }
  } else { rec.gpsState='unavailable'; }
  render();
}
function onGeoTick(pos){
  const rec=S.record; if(!rec.running||rec.paused) return;
  const {latitude,longitude,altitude}=pos.coords;
  rec.gpsState='live';
  if(rec.path.length){
    const last=rec.path[rec.path.length-1];
    const d=haversineKm(last.lat,last.lon,latitude,longitude);
    if(d<0.5) rec.distanceKm += d; // reject obvious GPS jump artifacts
    if(altitude!=null && rec.lastAlt!=null){ const dz=altitude-rec.lastAlt; if(dz>1 && dz<50) rec.gainM+=dz; }
  }
  if(altitude!=null) rec.lastAlt=altitude;
  rec.path.push({lat:latitude,lon:longitude,t:Date.now()});
  tickRecordUI();
}
function onGeoErr(err){ S.record.gpsState = err.code===1?'denied':'error'; tickRecordUI(); }
function pauseRecording(){ const rec=S.record; if(rec.paused){ rec._pauseStart=null; } else { rec._pauseStart=Date.now(); }
  rec.paused=!rec.paused;
  if(!rec.paused && rec._pauseStart){ rec._pausedMs=(rec._pausedMs||0)+(Date.now()-rec._pauseStart); }
  render(); }
function stopRecording(save){
  const rec=S.record;
  clearInterval(rec.timerId);
  if(rec.watchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(rec.watchId);
  if(save && rec.elapsedMs>2000){
    const act={ id:'a'+Date.now(), date:new Date().toISOString(), trailId:rec.trailId,
      name: rec.trailId? trailById(rec.trailId).name : 'Untitled activity',
      distanceKm: Math.round(rec.distanceKm*100)/100, gainM: Math.round(rec.gainM),
      durationSec: Math.round(rec.elapsedMs/1000), gps: rec.path.length>1 };
    S.activities.unshift(act); persistCore();
    showToast('Activity saved to your profile','checkCircle');
  }
  rec.running=false; rec.paused=false; rec.path=[]; rec.trailId=null; rec.gpsState=null;
  if(recLeaflet){ try{recLeaflet.remove();}catch(e){} recLeaflet=null; recPolyline=null; recMarker=null; recStartMarker=null; }
  render();
}
function tickRecordUI(){
  const t=document.getElementById('recTimer'); if(t) t.textContent=fmtClock(S.record.elapsedMs);
  const d=document.getElementById('recDist'); if(d) d.textContent=fmtDist(S.record.distanceKm);
  const g=document.getElementById('recGain'); if(g) g.textContent=fmtElev(S.record.gainM);
  const gs=document.getElementById('recGpsState'); if(gs) gs.textContent=gpsStateLabel();
  const pc=document.getElementById('recPace');
  if(pc){ const hrs=S.record.elapsedMs/3600000; const paceMinKm = S.record.distanceKm>0.05 ? (S.record.elapsedMs/60000)/S.record.distanceKm : 0;
    pc.textContent = paceMinKm>0 ? fmtPace(paceMinKm) : '—'; }
  updateRecordMap();
}
function fmtPace(minPerKm){
  const v = S.units==='km'? minPerKm : minPerKm*1.60934;
  const m=Math.floor(v), s=Math.round((v-m)*60);
  return m+':'+String(s).padStart(2,'0')+' /'+(S.units==='km'?'km':'mi');
}

function recordMapHtml(){
  const rec=S.record;
  return '<div id="recordMapWrap" style="height:190px;border-radius:16px;overflow:hidden;position:relative">'+

function wireRecordMap(){
  const el=document.getElementById('leafletRecord');
  if(!el || typeof L==='undefined') return;
  if(recLeaflet){ try{recLeaflet.remove();}catch(e){} recLeaflet=null; recPolyline=null; recMarker=null; recStartMarker=null; }
  const path=S.record.path;
  const center = path.length? [path[path.length-1].lat, path[path.length-1].lon] : (S.geo.status==='ok'?[S.geo.lat,S.geo.lon]:[45,-97]);
  recLeaflet = L.map(el, {zoomControl:false, attributionControl:true}).setView(center, path.length?16:4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'&copy; OpenStreetMap'}).addTo(recLeaflet);
  if(path.length) updateRecordMap();
}
function updateRecordMap(){
  if(!recLeaflet || typeof L==='undefined') return;
  const path=S.record.path; if(!path.length) return;
  const empty=document.getElementById('recordMapEmpty'); if(empty) empty.style.display='none';
  const latlngs=path.map(p=>[p.lat,p.lon]);
  if(!recPolyline) recPolyline=L.polyline(latlngs,{color:'#c0b6fb',weight:4}).addTo(recLeaflet);
  else recPolyline.setLatLngs(latlngs);
  if(!recStartMarker) recStartMarker=L.circleMarker(latlngs[0],{radius:5,color:'#c0b6fb',weight:2,fillColor:'#14151f',fillOpacity:1}).addTo(recLeaflet);
  const last=latlngs[latlngs.length-1];
  if(!recMarker) recMarker=L.circleMarker(last,{radius:7,color:'#fff',weight:2,fillColor:'#e28a78',fillOpacity:1}).addTo(recLeaflet);
  else recMarker.setLatLng(last);
  recLeaflet.panTo(last,{animate:true});
}
function gpsStateLabel(){
  const g=S.record.gpsState;
  if(g==='live') return 'GPS locked';
  if(g==='locating') return 'Finding GPS…';
  if(g==='denied') return 'Location denied — timer only';
  if(g==='unavailable') return 'No GPS on this device — timer only';
  if(g==='error') return 'GPS signal lost';
  return 'Waiting for GPS…';
}

let DB=null, communityUnsub=null, communityDocs=[];
function initDb(){
  if(!(window.claude && window.claude.use)) return;
  window.claude.use('db').then(d=>{
    DB=d;
    if(DB && S.view==='community') subscribeCommunity();
  }).catch(()=>{});
}
function subscribeCommunity(){
  if(!DB || communityUnsub) return;
  try{
    communityUnsub = DB.collection('reports').orderBy('ts','desc').limit(30).onSnapshot(
      snap=>{ communityDocs = snap.docs.map(d=>Object.assign({_id:d.id}, d.data())); if(S.view==='community') renderCommunityList(); },
      err=>{ /* degrade silently */ }
    );
  }catch(e){}
}
function postReport(trailId, tag, note){
  const name = (S.displayName||'').trim() || 'A hiker';
  const body = { trailId: trailId||null, trailName: trailId? trailById(trailId).name : null,
    tag: tag, note: (note||'').slice(0,400), author: name, ts: Date.now() };
  if(DB){
    DB.collection('reports').add(body).then(()=>{ showToast('Report posted','checkCircle'); }).catch(()=>{ showToast('Could not post — try again','warning'); });
  } else {
    const local = ld('localReports', []);
    body._id = 'local'+Date.now(); local.unshift(body); sv('localReports', local); communityDocs = local.concat(communityDocs);
    showToast('Saved on this device','checkCircle'); renderCommunityList();

  const groups=[];

    }
    groups.push({icon:'starFill',title:'Popular right now',items:TRAILS.slice().sort((a,b)=>b.rating-a.rating).slice(0,5).map(t=>({icon:'mapPin',name:t.name,sub:t.park,badge:t.rating.toFixed(1)+'★',onclick:"R.openTrail('"+t.id+"')"}))});

function filterSummary(f){

function mUnit(m){ return S.units==='km'?m:m*3.28084; }
function ratingDistribution(avg){
  const top=Math.max(38,Math.round((avg-3)*55)); const rest=100-top;
  return [top, Math.round(rest*.55), Math.round(rest*.28), Math.round(rest*.12), Math.max(1,Math.round(rest*.05))];
}
function reviewBlurb(t){
  const hi = t.difficulty==='Strenuous'||t.difficulty==='Hard' ? 'Most reviewers rate the views well worth the climb, and mention starting early to beat both the crowds and the heat.' : 'Reviewers consistently call it one of the easier ways to see the area\'s big scenery, and a good option with kids.';
  return hi+' Trail condition reports from the Ridgeline community for this trail show up under Community.';
}
function elevationProfile(t){
  let seed=0; for(let i=0;i<t.id.length;i++) seed=(seed*31+t.id.charCodeAt(i))>>>0;
  const rnd=()=>{ seed=(seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; };
  const W=320,H=72,N=13; const base=regionOf(t.region).baseElevM, top=t.highM;
  let pts=[]; for(let i=0;i<=N;i++){
    const x=i/N;
    const shape = t.routeType==='Out & back' ? (x<=0.5? x*2 : (1-x)*2) : x;
    const noise=(rnd()-0.5)*0.08;
    const y = Math.max(0,Math.min(1, shape+noise));
    pts.push([Math.round(x*W), Math.round(H-4-(y*(H-14))) ]);
  }
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=pts.map(p=>p.join(',')).join(' ')+' '+W+','+H+' 0,'+H;
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px" preserveAspectRatio="none">'+
    '<polygon points="'+area+'" fill="var(--accent-tint)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent-2)" stroke-width="2"/>'+
  '</svg>';
}
function routeSvg(t){
  let seed=0; for(let i=0;i<t.id.length;i++) seed=(seed*31+t.id.charCodeAt(i))>>>0;
  const rnd=()=>{ seed=(seed*1103515245+12345)>>>0; return (seed>>>8)/16777216; };
  const pts=[]; const n=7; let x=40,y=240;
  for(let i=0;i<n;i++){ pts.push([x,y]); x+=30+rnd()*30; y-=20+rnd()*22; }
  const line=pts.map(p=>p.join(',')).join(' ');
  return '<svg viewBox="0 0 340 270" style="position:absolute;inset:0;width:100%;height:100%">'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent-2)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+pts[0][0]+'" cy="'+pts[0][1]+'" r="6" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2.5"/>'+
    '<circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="6" fill="var(--accent-2)"/>'+
  '</svg>';
}
function waypoints(t){
  const feat = t.features.find(f=>['waterfall','lake','views','historic-site','river'].includes(f));
  const mid = Math.round(t.lengthKm*0.5*10)/10;
  const list=[{icon:'flag',name:'Trailhead',km:0,note:'Start — check conditions before you go'}];
  if(feat) list.push({icon:'mapPin',name:FEATURE_LABEL[feat]||'Midpoint',km:mid,note:'Good rest stop, roughly halfway'});
  list.push({icon:'mountainFill',name:t.endLabel||t.name,km:t.lengthKm,note: t.routeType==='Out & back' ? 'Turnaround point' : 'Trail end'});
  return list;
}

    '<div class="px row between"><span class="row gap8"><span class="livedot" style="width:9px;height:9px;box-shadow:none;background:'+(rec.paused?'var(--text-4)':'var(--danger)')+'"></span><span style="font-size:12.5px;color:var(--text-3)" id="recGpsState">'+gpsStateLabel()+'</span></span>'+
      '<button class="iconbtn ghost" onclick="R.confirmDiscard()">'+icon('x',20)+'</button></div>'+
    '<div class="px" style="margin-top:10px">'+recordMapHtml()+'</div>'+
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0">'+
      '<div id="recTimer" style="font:700 44px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums">'+fmtClock(rec.elapsedMs)+'</div>'+
      '<div class="sub" style="margin-top:2px">elapsed time</div>'+
      '<div class="row gap0" style="margin-top:18px;width:100%;padding:0 24px">'+
        '<div class="stat-tile"><div class="v" id="recDist">'+fmtDist(rec.distanceKm)+'</div><div class="l">Distance</div></div>'+
        '<div class="stat-tile"><div class="v" id="recGain">'+fmtElev(rec.gainM)+'</div><div class="l">Elev. gain</div></div>'+
        '<div class="stat-tile"><div class="v" id="recPace">—</div><div class="l">Pace</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="px row gap14" style="padding-bottom:calc(var(--safe-b)+22px)">'+
      '<button class="btn btn-secondary" style="flex:1;min-height:58px" onclick="R.togglePause()">'+icon(rec.paused?'play':'pause',20)+(rec.paused?'Resume':'Pause')+'</button>'+
      '<button class="btn btn-primary" style="flex:1;min-height:58px" onclick="R.finishRecording()">'+icon('stop',20)+'Finish</button>'+
    '</div>'+
  '</div>';
}

/* ---- Offline manager (1h) ---- */
function offlineView(){
  const used=totalStorageMB();
  return '<div class="screen">'+
    '<div class="appbar"><h1>Offline</h1></div>'+
    '<div class="px" style="margin-top:4px">'+
      '<div class="row between"><span style="font-size:13px;font-weight:600">'+used+' MB used</span><span class="sub" id="deviceQuota">checking device storage…</span></div>'+
      '<div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:'+Math.min(100,used/20)+'%"></div></div>'+
    '</div>'+
    '<div class="px section-label" style="margin-top:20px">Downloaded regions</div>'+
    '<div class="px" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">'+
    (S.downloaded.length? S.downloaded.map(rid=>{ const r=regionOf(rid); return '<div class="card card-pad row gap12">'+
      icon('mapPin',18)+'<div style="flex:1"><div style="font-size:13.5px;font-weight:600">'+r.name+'</div><div class="sub">'+trailsInRegion(rid).length+' trails · '+regionStorageMB(rid)+' MB</div></div>'+
      '<button class="iconbtn ghost" style="color:var(--danger)" onclick="R.removeRegion(\''+rid+'\')">'+icon('trash',17)+'</button>'+
    '</div>'; }).join('') : emptyState('cloudOff','Nothing downloaded yet','Pick a region to hike offline.'))+
    '</div>'+
    (S.downloaded.length<REGIONS.length ? '<div class="px" style="margin-top:8px">'+
      '<div class="section-label" style="margin:14px 0 10px">Add another region</div>'+
      REGIONS.filter(r=>!S.downloaded.includes(r.id)).map(r=>'<div class="card card-pad row gap12" style="margin-bottom:10px;cursor:pointer" onclick="R.nav(\'download\',{id:\''+trailsInRegion(r.id)[0].id+'\'})">'+
        icon('download',18)+'<div style="flex:1"><div style="font-size:13.5px;font-weight:600">'+r.name+'</div><div class="sub">~'+regionStorageMB(r.id)+' MB</div></div>'+icon('chevronRight',18)+'</div>').join('')+
    '</div>' : '')+
    '<div class="px" style="margin-top:22px">'+
      '<div class="section-label" style="margin-bottom:10px">Auto-update rules</div>'+
      '<div class="row between" style="padding:11px 0;border-bottom:1px solid var(--border-soft)"><div><div style="font-size:13.5px">Refresh over Wi-Fi only</div><div class="sub">Updates regions overnight, never on cellular</div></div>'+toggleHtml(S.wifiOnly,'R.toggleWifiOnly()')+'</div>'+
      '<div class="row between" style="padding:11px 0"><div><div style="font-size:13.5px">Auto-update downloaded regions</div><div class="sub">Keep trail data current automatically</div></div>'+toggleHtml(S.autoUpdate,'R.toggleAutoUpdate()')+'</div>'+
    '</div>'+
  '</div>';
}

/* ---- Profile (1k) ---- */
function profileView(){
  const acts=S.activities;
  const totalKm=acts.reduce((s,a)=>s+a.distanceKm,0), totalGain=acts.reduce((s,a)=>s+a.gainM,0);
  const yr=new Date().getFullYear();
  const ytdKm=acts.filter(a=>new Date(a.date).getFullYear()===yr).reduce((s,a)=>s+a.distanceKm,0);
  return '<div class="screen">'+
    '<div class="appbar"><h1>You</h1><button class="iconbtn" onclick="R.nav(\'about\')">'+icon('info',18)+'</button></div>'+
    '<div class="px row gap12" style="margin-top:4px">'+
      '<div style="width:52px;height:52px;border-radius:50%;background:var(--accent-fill);display:flex;align-items:center;justify-content:center;color:var(--accent-2)">'+icon('user',24)+'</div>'+
      '<div style="flex:1"><input class="textinput" style="padding:8px 11px;font-size:14px;font-weight:600" placeholder="Your name" value="'+esc(S.displayName)+'" oninput="R.setDisplayName(this.value)"></div>'+
    '</div>'+
    '<div class="px row" style="margin-top:18px;padding:14px 0;border-radius:12px;background:var(--card);margin-left:18px;margin-right:18px;width:auto">'+
      '<div class="stat-tile"><div class="v">'+fmtDist(totalKm)+'</div><div class="l">All time</div></div><div class="divider-v"></div>'+
      '<div class="stat-tile"><div class="v">'+fmtElev(totalGain)+'</div><div class="l">Elev. gained</div></div><div class="divider-v"></div>'+
      '<div class="stat-tile"><div class="v">'+acts.length+'</div><div class="l">Activities</div></div>'+
    '</div>'+
    '<div class="px sub" style="margin-top:10px;text-align:center">'+fmtDist(ytdKm)+' so far in '+yr+'</div>'+
    '<div class="px row between" style="margin-top:22px">'+
      '<div class="section-label">Saved & lists</div><button class="btn-ghost btn" style="min-height:auto;padding:0;font-size:12px" onclick="R.nav(\'saved\')">See all '+icon('chevronRight',13)+'</button>'+
    '</div>'+
    '<div class="px" style="margin-top:10px"><div class="card card-pad row gap10" style="cursor:pointer" onclick="R.nav(\'saved\')">'+icon('bookmarkFill',18)+'<span style="flex:1;font-size:13.5px">'+S.saved.length+' saved trail'+(S.saved.length===1?'':'s')+'</span>'+icon('chevronRight',16)+'</div></div>'+
    '<div class="px row between" style="margin-top:22px"><div class="section-label">Recent activities</div></div>'+
    '<div class="px" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+
    (acts.length? acts.slice(0,8).map(a=>'<div class="card card-pad row gap12">'+icon(a.gps?'compass':'clock',18)+
      '<div style="flex:1"><div style="font-size:13.5px;font-weight:600">'+esc(a.name)+'</div><div class="sub">'+new Date(a.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+fmtClock(a.durationSec*1000)+(a.gps?' · GPS':' · timer only')+'</div></div>'+
      '<div style="text-align:right"><div style="font:600 12.5px var(--font-mono)">'+fmtDist(a.distanceKm)+'</div><div class="sub">'+fmtElev(a.gainM)+'</div></div>'+
    '</div>').join('') : emptyState('dot','No activities yet','Hit Record to track your first hike.'))+
    '</div>'+
  '</div>';
}
function savedView(){
  return '<div class="screen">'+
    '<div class="appbar solid"><button class="iconbtn ghost" style="margin-left:-8px" onclick="R.nav(\'profile\')">'+icon('chevronLeft',20)+'</button><h1 style="font-size:17px">Saved trails</h1></div>'+
    '<div class="px" style="display:flex;flex-direction:column;gap:10px;margin-top:12px">'+
    (S.saved.length? S.saved.map(id=>trailCardHtml(trailById(id))).join('') : emptyState('bookmark','Nothing saved yet','Tap the bookmark icon on any trail to keep it here.'))+
    '</div>'+
  '</div>';
}

/* ---- Community (1l) ---- */
function communityView(){
  return '<div class="screen">'+
    '<div class="appbar"><h1>Community</h1></div>'+
    '<p class="px sub" style="margin-top:-4px">Live condition reports from everyone using Ridgeline'+(DB?'':' on this device')+'.</p>'+
    '<div class="px" style="margin-top:14px"><button class="btn btn-secondary btn-block" onclick="R.openReportForm()">'+icon('plus',16)+'Post a condition report</button></div>'+
    '<div id="communityList" class="px" style="display:flex;flex-direction:column;gap:10px;margin-top:16px">'+communityListHtml()+'</div>'+
  '</div>';
}
function communityListHtml(){
  const local = ld('localReports', []);
  const docs = (DB? communityDocs : local);
  if(!docs.length) return emptyState('moon','No reports yet','Be the first to share trail conditions.');
  return docs.map(r=>'<div class="card card-pad">'+
    '<div class="row between"><span style="font-size:13px;font-weight:600">'+esc(r.author||'A hiker')+'</span><span class="sub">'+timeAgo(r.ts)+'</span></div>'+
    (r.trailName? '<div class="row gap6" style="margin-top:4px">'+icon('mapPin',13)+'<span class="sub">'+esc(r.trailName)+'</span></div>':'')+
    '<div class="row gap6" style="margin-top:8px"><span class="tag" style="background:var(--accent-tint);color:var(--accent-2)">'+esc(conditionLabel(r.tag))+'</span></div>'+
    (r.note? '<p style="font-size:12.5px;line-height:1.5;color:var(--text-2);margin-top:8px">'+esc(r.note)+'</p>':'')+
  '</div>').join('');
}
function conditionLabel(tag){ return {clear:'Trail clear',muddy:'Muddy',snow:'Snow/ice',closed:'Closure reported',crowded:'Busy today',wildlife:'Wildlife sighting'}[tag]||tag; }
function timeAgo(ts){ const s=(Date.now()-ts)/1000; if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

function aboutView(){
  return '<div class="screen no-tab">'+
    '<div class="appbar solid"><button class="iconbtn ghost" style="margin-left:-8px" onclick="R.nav(\'profile\')">'+icon('chevronLeft',20)+'</button><h1 style="font-size:17px">About Ridgeline</h1></div>'+
    '<div class="px" style="margin-top:8px;display:flex;flex-direction:column;gap:14px">'+
      '<div class="row gap10">'+icon('mountainFill',26)+'<span style="font:700 18px var(--font-ui)">Ridgeline</span></div>'+
      '<p class="sub">A personal offline-trail companion covering Banff & Lake Louise, the Sea-to-Sky & North Shore, Zion & Bryce, and the Grand Canyon.</p>'+
      '<div class="card card-pad"><div style="font-size:13px;font-weight:600">Trail data</div><p class="sub" style="margin-top:6px">Distances, elevation gain and ratings for all 24 trails are sourced from AllTrails. A few pages link out to the full AllTrails listing for photos and reviews.</p></div>'+
      '<div class="card card-pad"><div style="font-size:13px;font-weight:600">Recording</div><p class="sub" style="margin-top:6px">Uses your device\'s GPS while this app is open in the foreground. Like most browser-based apps, it can\'t record in the background with the screen off.</p></div>'+
      '<div class="card card-pad"><div style="font-size:13px;font-weight:600">Offline storage</div><p class="sub" style="margin-top:6px">"Downloading" a region caches its trail data for offline browsing. Pack sizes are estimates — this is a lightweight app, not a full map-tile downloader.</p></div>'+
      '<button class="btn btn-danger btn-block" style="margin-top:6px" onclick="R.confirmReset()">Reset all app data</button>'+
    '</div>'+
  '</div>';
}
function emptyState(ic,title,sub){ return '<div class="empty">'+icon(ic,32)+'<div style="font-size:14px;font-weight:600;color:var(--text-2)">'+esc(title)+'</div><div style="font-size:12.5px">'+esc(sub)+'</div></div>'; }

/* ================================================================== ACTIONS */
const R = {
  nav(v,p){ nav(v,p); },
  back(){ if(S.view==='trail'||S.view==='download') nav('explore'); else history.back(); },
  onboardStep(step){ nav('onboarding' in {}?'':S.view, S.params); S.view='onboarding'; S.params={step:step, region:S.params.region}; render(); },
  onboardPickRegion(id){ S.params.region=id; render(); },
  finishOnboarding(skip){
    if(!skip && S.params.region){ if(!S.downloaded.includes(S.params.region)) S.downloaded.push(S.params.region); }
    S.onboarded=true; persistCore(); nav('explore');
  },
  locate(){ requestLocationOnce(); },
  openTrail(id){ nav('trail',{id, tab:'overview'}); },
  setTrailTab(tab){ S.params.tab=tab; render(); },
  openRegion(id){ S.filters=defaultFilters(); S.filters.region=id; nav('searchResults'); },
  toggleSaved(id){
    const i=S.saved.indexOf(id);
    if(i>=0){ S.saved.splice(i,1); showToast('Removed from saved','x'); } else { S.saved.unshift(id); showToast('Saved','bookmarkFill'); }
    persistCore(); render();
  },
  shareTrail(id){ const t=trailById(id); const text=t.name+' — '+fmtDist(t.lengthKm)+', '+fmtElev(t.gainM)+' gain ('+t.difficulty+')'+(t.source?' '+t.source.url:'');
    if(navigator.share){ navigator.share({title:t.name,text}).catch(()=>{}); } else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>showToast('Copied trail details','check')); } else { showToast('Share not available'); } },
  onSearchInput(v){ const f=parseQuery(v); S.filters=f; const el=document.querySelector('.px'); render(); const inp=document.getElementById('searchInput'); if(inp){inp.focus(); inp.setSelectionRange(v.length,v.length);} },
  runSearch(){ nav('searchResults'); },
  toggleOfflineOnly(){ S.filters.offlineOnly=!S.filters.offlineOnly; render(); },
  sortResults(k){ S.params.sort=k; render(); },
  closeSheet(){ nav('searchResults'); },
  resetFilters(){ const q=S.filters.q; S.filters=defaultFilters(); S.filters.q=q; render(); },
  setUnits(u){ S.units=u; persistCore(); render(); },
  setFilterRegion(id){ S.filters.region=id; render(); },
  toggleArr(key,val){ const a=S.filters[key]; const i=a.indexOf(val); if(i>=0)a.splice(i,1); else a.push(val); render(); },
  toggleBool(key){ S.filters[key]=!S.filters[key]; render(); },
  setLenIdx(v){ S.filters.lenIdx=+v; render(); },
  setGainIdx(v){ S.filters.gainIdx=+v; render(); },
  setPlan(key,val){ S.storagePlan[key]=val; persistCore(); render(); },
  confirmDownload(regionId){
    const region = regionOf(regionId);
    const urls = regionTileUrls(region, S.storagePlan.detail==='full');
    S.params.progress=0; render();
    const finish=()=>{
      if(!S.downloaded.includes(regionId)) S.downloaded.push(regionId); persistCore();
      showToast(region.name+' available offline','checkCircle');
      setTimeout(()=>{ S.params.progress=null; nav('trail',{id:S.params.id}); },400);
    };
    if(!('serviceWorker' in navigator)){ finish(); return; }
    const timeout = new Promise(res=>setTimeout(()=>res(null), 4000));
    Promise.race([navigator.serviceWorker.ready, timeout]).then(reg=>{
      const sw = reg && (reg.active || navigator.serviceWorker.controller);
      if(!sw){ finish(); return; } // SW unavailable — don't block the user, tiles still cache opportunistically once it's active
      const onMsg=(ev)=>{
        const d=ev.data;
        if(d && d.type==='TILE_PROGRESS' && d.regionId===regionId){
          S.params.progress = Math.round(d.done/d.total*100); render();
          if(d.done>=d.total){ navigator.serviceWorker.removeEventListener('message', onMsg); finish(); }
        }
      };
      navigator.serviceWorker.addEventListener('message', onMsg);
      sw.postMessage({type:'CACHE_TILES', regionId, urls});
    }).catch(finish);
  },
  removeRegion(id){
    const i=S.downloaded.indexOf(id); if(i>=0){ S.downloaded.splice(i,1); persistCore();
      if('serviceWorker' in navigator && navigator.serviceWorker.controller){ navigator.serviceWorker.controller.postMessage({type:'CLEAR_TILES', regionId:id}); }
      showToast(regionOf(id).name+' removed','trash'); render(); }
  },
  toggleWifiOnly(){ S.wifiOnly=!S.wifiOnly; persistCore(); render(); },
  toggleAutoUpdate(){ S.autoUpdate=!S.autoUpdate; persistCore(); render(); },
  setDisplayName(v){ S.displayName=v; persistCore(); },
  setRecordTrail(id){ S.params.trailId=id; render(); },
  setRecordActivity(a){ S.params.activity=a; render(); },
  startNavigate(trailId){ nav('record',{trailId, activity:'hiking'}); },
  beginRecording(){ startRecording(S.params.trailId); },
  togglePause(){ pauseRecording(); },
  finishRecording(){ stopRecording(true); nav('profile'); },
  confirmDiscard(){ if(confirm('Discard this recording?')){ stopRecording(false); nav('record'); } },
  openReportForm(){
    const wrap=document.createElement('div'); wrap.innerHTML=reportSheet(); document.body.appendChild(wrap.firstChild);
  },
  closeReportForm(){ const el=document.getElementById('reportSheetWrap'); if(el) el.remove(); },
  submitReport(){
    const trailSel=document.getElementById('rfTrail'), tagSel=document.getElementById('rfTag'), noteEl=document.getElementById('rfNote');
    postReport(trailSel.value||null, tagSel.value, noteEl.value);
    R.closeReportForm();
  },
  confirmReset(){ if(confirm('This clears saved trails, downloads, activities and settings on this device. Continue?')){ Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k)); location.reload(); } },
};
function reportSheet(){
  return '<div id="reportSheetWrap" class="sheet-wrap"><div class="sheet-backdrop" onclick="R.closeReportForm()"></div><div class="sheet">'+
    '<div class="sheet-handle"></div><h2 style="font-size:17px;margin-bottom:14px">Post a condition report</h2>'+
    '<label class="field-label">Trail (optional)</label>'+
    '<select id="rfTrail" class="textinput" style="margin-bottom:14px"><option value="">General / not trail-specific</option>'+TRAILS.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select>'+
    '<label class="field-label">Condition</label>'+
    '<select id="rfTag" class="textinput" style="margin-bottom:14px">'+['clear','muddy','snow','closed','crowded','wildlife'].map(k=>'<option value="'+k+'">'+conditionLabel(k)+'</option>').join('')+'</select>'+
    '<label class="field-label">Note (optional)</label>'+
    '<textarea id="rfNote" class="textinput" placeholder="What did you see out there?"></textarea>'+
    '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="R.submitReport()">Post report</button>'+
  '</div></div>';
}

/* ---------------------------------------------------------------- boot */
function checkDeviceStorage(){
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(e=>{
      const el=document.getElementById('deviceQuota');
      if(el && e.quota) el.textContent = 'of ~'+Math.round(e.quota/1048576)+' MB free on this device';
    }).catch(()=>{});
  }
}
const _origRender = render;
render = function(){ _origRender(); if(S.view==='offline') checkDeviceStorage(); };

render();
initDb();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
